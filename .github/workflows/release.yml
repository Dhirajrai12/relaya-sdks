# Publishing a GitHub release tagged vX.Y.Z publishes every SDK at X.Y.Z.
# A registry whose secrets aren't set yet is skipped (with a note), so you can switch them on one at a time.
#
#   npm            none: trusted publishing                    (npmjs.com → package → Settings → Trusted Publisher → GitHub Actions,
#                                                              this repo + release.yml), then set the repository variable
#                                                              NPM_TRUSTED_PUBLISHING=true. Works with 2FA; no token to leak.
#                  or NPM_TOKEN (a granular token; must bypass 2FA, which npm is phasing out)
#   PyPI           none: trusted publishing                    (pypi.org → Publishing → add this repo + release.yml, environment "pypi"),
#                  then set the repository variable PUBLISH_PYPI=true
#   Packagist      none: it follows the repo's tags            (packagist.org → Submit the repo URL once)
#   Go             none: this workflow adds the go/vX.Y.Z tag
#   Maven Central  MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD (central.sonatype.com → user token)
#                  MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE (a GPG key published to a keyserver)

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $tag)"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" != "true" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::notice::npm skipped: set NPM_TRUSTED_PUBLISHING=true (trusted publishing) or the NPM_TOKEN secret"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        working-directory: .
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - if: steps.check.outputs.skip != 'true'
        run: npm ci && npm test && npm run build
      # Trusted publishing needs npm 11.5.1 or newer.
      - if: steps.check.outputs.skip != 'true' && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest && npm --version
      - if: steps.check.outputs.skip != 'true' && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm publish --access public --provenance
      - if: steps.check.outputs.skip != 'true' && vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: version
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - working-directory: python
        run: |
          PYTHONPATH=src python -m unittest discover -s tests
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  go:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the go/vX.Y.Z tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - working-directory: go
        run: go test ./...
      # A Go module in a subfolder is versioned by tags named <folder>/vX.Y.Z.
      - run: |
          tag="go/v${{ needs.version.outputs.version }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          # Ask the Go module proxy to fetch it now so `go get` sees it immediately.
          # The proxy escapes capitals in module paths as !lowercase.
          path=$(echo "github.com/${GITHUB_REPOSITORY}/go" | sed 's/[A-Z]/!\L&/g')
          curl -sf "https://proxy.golang.org/${path}/@v/v${{ needs.version.outputs.version }}.info" || true

  maven:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$USER" ] || [ -z "$KEY" ]; then echo "::notice::Maven Central skipped: MAVEN_CENTRAL_USERNAME / MAVEN_GPG_PRIVATE_KEY are not set"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: steps.check.outputs.skip != 'true'
        working-directory: .
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - if: steps.check.outputs.skip != 'true'
        run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
